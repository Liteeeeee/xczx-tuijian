server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml application/xml+rss application/vnd.ms-fontobject font/ttf font/opentype font/x-woff image/svg+xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    charset utf-8;
    client_max_body_size 50m;

    # ------------------------------------------------------------------
    # 运维快速诊断端点
    # 访问 https://aitj.xiancaozhenxuan.cn/debug 就能看到容器内的反向代理参数，
    # 用来快速确认 502 是外层 ALB 返回的，还是这层 nginx 返回的。
    # ------------------------------------------------------------------
    location = /debug {
        default_type application/json;
        return 200 '{"status":"ok","nginx":"xczx-tuijian-web-embedded","backend":"https://aitj.xiancaozhenxuan.cn","server_addr":"$server_addr","remote_addr":"$remote_addr","http_host":"$http_host","time_iso8601":"$time_iso8601"}';
    }

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # 后端 RuoYi 网关上游（C 端 /app、AI /ai、登录验证码 /captchaImage）
    # 注意：
    #   1. proxy_pass 末尾不加斜杠，保持原路径原样转发
    #   2. 反代到 HTTPS 上游必须开 SNI，否则 SSL 握手会被目标网关直接拒绝并 502
    #   3. Host 必须写死上游真实域名（不能写 $host），否则后端多租户/域名路由会判错
    set $backend_upstream https://aitj-api.xiancaozhenxuan.cn;

    location /app/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host aitj.xiancaozhenxuan.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_ssl_server_name on;
        proxy_ssl_name aitj.xiancaozhenxuan.cn;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        # 万一上游 502/504，在响应头里塞个标记，方便快速定位是哪一层 502
        add_header X-Upstream $backend_upstream always;
    }

    location /ai/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host aitj.xiancaozhenxuan.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_ssl_server_name on;
        proxy_ssl_name aitj.xiancaozhenxuan.cn;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        add_header X-Upstream $backend_upstream always;
    }

    location = /captchaImage {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host aitj.xiancaozhenxuan.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_ssl_server_name on;
        proxy_ssl_name aitj.xiancaozhenxuan.cn;
    }

    # 静态资源（tabbar 图 / 页面切图 / 构建产物）
    #   - dist 根目录和 dist/static 目录都放了 tabbar 双拷贝，这里统一兜底
    #   - 如果将来部署在子路径 /tuijian，外层 nginx 需要用 alias，不要改本配置
    location /static/ {
        try_files $uri $uri/ =404;
    }

    location /images/ {
        try_files $uri /static$uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpe?g|gif|webp|avif)(\?.*)?$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri $uri/ =404;
    }

    # uni-app H5 hash 路由 + history 双兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
