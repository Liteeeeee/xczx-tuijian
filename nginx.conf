server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml application/xml+rss application/vnd.ms-fontobject font/ttf font/opentype font/x-woff image/svg+xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    charset utf-8;
    client_max_body_size 50m;

    # 运维诊断端点（纯前端容器不做反向代理，说明用的是跨域直连 server.api.xiancaozhenxuan.cn）
    location = /debug {
        default_type application/json;
        return 200 '{"status":"ok","nginx":"xczx-tuijian-web-static","mode":"cors-direct","apiBase":"https://server.api.xiancaozhenxuan.cn","apiPrefix":"/app-api","server_addr":"$server_addr","remote_addr":"$remote_addr","http_host":"$http_host","time_iso8601":"$time_iso8601"}';
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 静态资源：tabbar、切图、构建产物。
    # - /static/ 直接命中
    # - /images/ 先找根下，找不到回退 /static/images/（兼容 uni 老版打包习惯）
    location /static/ {
        try_files $uri $uri/ =404;
    }
    location /images/ {
        try_files $uri /static$uri =404;
    }
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpe?g|gif|webp|avif)(\?.*)?$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri $uri/ =404;
    }

    # uni-app H5 hash 路由 + history 双兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
