version: '3.9'

services:
  xczx-tuijian-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: xczx-tuijian-web:latest
    container_name: xczx-tuijian-web
    restart: unless-stopped
    ports:
      - '8080:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      TZ: Asia/Shanghai
    networks:
      - xczx-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '3'

networks:
  xczx-net:
    driver: bridge
